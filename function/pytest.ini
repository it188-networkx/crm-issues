[pytest]
# CRM 功能测试执行配置
# 运行入口：crm-issues/function/ 目录下执行 pytest

python_files  = test_*.py
python_classes = Test*
python_functions = test_*

# 全局框架路径（自动加入 Python 模块搜索路径，无需在 conftest.py 中手动 sys.path.insert）
pythonpath = ../../test-base/scripts/html

# 测试目录（相对于本文件所在目录）
testpaths = .

addopts =
    -v
    -p no:playwright
    --tb=short
    --strict-markers
    --capture=no
